services:
  server:
    build: .
    image: preview-deploy-server
    container_name: preview-deploy-server
    ports:
      - "${PREVIEW_DEPLOY_PORT:-8080}:8080"
    environment:
      DATA_DIR: /app/data
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - preview-net

networks:
  preview-net:
    name: preview-net

volumes:
  data:
