services:
  server:
    build: .
    image: preview-deploy-server
    container_name: preview-deploy-server
    user: root
    network_mode: service:ts-cert
    depends_on:
      - ts-cert
    environment:
      DATA_DIR: /app/data
      ROUTING__BASEHOST: ${SERVER_HOSTNAME:-preview-server}.${TAILNET_DOMAIN:?TAILNET_DOMAIN_required}
      GITHUB__TOKEN: ${GITHUB_PAT:?GITHUB_PAT_required}
      SEED__NAME: ${SEED_APP_NAME:-}
      SEED__OWNER: ${SEED_APP_OWNER:-}
      SEED__REPO: ${SEED_APP_REPO:-}
      SEED__TOKEN: ${SEED_APP_TOKEN:-}
      SEED__TTLDAYS: ${SEED_APP_TTL_DAYS:-14}
      SWEEP__INTERVAL: ${SWEEP_INTERVAL:-00:05:00}
      DOCKER__ATTACHNETWORKONSTARTUP: "true"
      DOCKER__SELFCONTAINERNAME: preview-deploy-server
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/app/data
      - certs:/certs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  ts-cert:
    image: tailscale/tailscale:stable
    container_name: preview-deploy-ts-cert
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?TS_AUTHKEY_required}
      TS_HOSTNAME: ${SERVER_HOSTNAME:-preview-server}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TAILNET_DOMAIN: ${TAILNET_DOMAIN:?TAILNET_DOMAIN_required}
      SERVER_HOSTNAME: ${SERVER_HOSTNAME:-preview-server}
    volumes:
      - ts-state:/var/lib/tailscale
      - certs:/certs
    command: /bin/sh -c '/usr/local/bin/containerboot & for i in $$(seq 1 30); do tailscale status >/dev/null 2>&1 && break; sleep 2; done; while true; do if tailscale cert --min-validity 24h --cert-file /certs/api.crt --key-file /certs/api.key "$${SERVER_HOSTNAME}.$${TAILNET_DOMAIN}" && tailscale cert --min-validity 24h --cert-file /certs/preview.crt --key-file /certs/preview.key "*.$${SERVER_HOSTNAME}.$${TAILNET_DOMAIN}"; then sleep 6h; else sleep 30; fi; done'

networks:
  preview-net:
    name: preview-net

volumes:
  data:
  certs:
  ts-state:
